; Search keywords. Left side = fixed internal keyword, do not change. Right side =
; the words you type, comma separated. You can add more. Lowercase, UTF-8. To translate: copy to
; SmartSearch_<lang>.ini and replace the right side with your language's words.
; For translators: each word on the right side must be a SINGLE word (no spaces). The query is
; split on spaces before lookup, so a multi-word alias like "hache de guerre" never matches.
; Even when the left-side keyword is multi-word (e.g. "soul gem"), give a one-word translation
; for it (e.g. "gemme"). This only applies to translated files; in English, multi-word phrases
; like "soul gem" work when typed because they match the item fields directly.

