DebugCheckbox = Debug Mode
DebugHelp = Enable detailed SKSE logging for troubleshooting.
MinBossLevel = Minimum Boss Level
MinBossLevelHelp = Any actor at or above this level is classified as a Boss and receives Boss tab settings.
DamageMultiplier = Damage Multiplier
DamageMultiplierHelp = Multiplier applied to this actor type's outgoing damage.
HealthAddition = Health Addition
HealthAdditionHelp = Flat value added to this actor type's current health.
StaminaAddition = Stamina Addition
StaminaAdditionHelp = Flat value added to this actor type's current stamina.
MagickaAddition = Magicka Addition
MagickaAdditionHelp = Flat value added to this actor type's current magicka.
MagicResist = Magic Resist
MagicResistHelp = Magic resistance modification.
BaseValue = Base Additional Value
BaseValueHelp = This value is applied once when an actor is first processed by the mod. It is a permanent flat increase or decrease that does not change with level differences. Only per-level additions update dynamically afterwards. Negative values reduce the stat instead.
PerLevelAbove = Per Level Above
PerLevelAboveHelp = When an enemy is higher level than you, this amount is added per level of difference. Example: setting this to 20 means a level 6 bandit gets +100 Health when you are level 1 (5 levels above x 20). As you level up and close the gap, this bonus shrinks. Enemies become less tough as you catch up. Use negative values to penalize higher-level enemies instead (e.g. -10 adds -50 Health when enemy is 5 levels above).
PerLevelBelow = Per Level Below
PerLevelBelowHelp = When an enemy is lower level than you, this amount is added per level of difference. Example: setting this to 10 means a level 1 bandit gets +20 Health when you are level 3 (2 levels below x 10). The more you outlevel them, the tougher they get to keep fights challenging. Use negative values to weaken lower-level enemies instead (e.g. -5 means enemy loses 25 Health when you are 5 levels above them).
GeneralSeparator = --- General ---
StatSection = --- Stat Modifiers ---
StatSectionHelp = Stat modifiers. Base value is applied once per actor and does not change. Per-level fields adjust dynamically as the level gap between you and the enemy changes. Negative values are allowed for all fields except Damage Multiplier.
BlacklistSection = --- Blacklist ---
BlacklistHelp = Prevent NPCs from being modified. Matches case-insensitive partial text against: actor name, Editor ID, class name, faction names, and actor keywords. Example: 'executioner' blocks any NPC with that keyword, class, or name.
BlacklistInputLabel = Blacklist Text
BlacklistInputHelp = Type any text (name, Editor ID, class, faction, or keyword) and click Add. Any NPC matching this text in any of those fields will be skipped.
BlacklistSaveButton = Add
DeleteBlacklistHelp = Remove this entry from the blacklist
ExponentialScaling = Exponential Scaling
ExponentialHelp = Curves stat growth so early levels give small bonuses and later levels give large ones. At low level differences you feel little change. As the gap widens the bonus grows faster, keeping high-level enemies dangerous without making early fights unfair. After 50 levels of difference it returns to flat per-level to stay sane.
