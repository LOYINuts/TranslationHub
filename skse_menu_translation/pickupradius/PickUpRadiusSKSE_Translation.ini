SkipSweepSection = -- Skip Sweep Hotkey --
SkipSweepKBLabel = Keyboard Skip Key
SkipSweepKBHelp = Hold this key while activating an item to skip the radius sweep. Use this for compatibility with mods like UseOrTake.
SkipSweepGPLabel = Gamepad Skip Key
SkipSweepGPHelp = Hold this gamepad button while activating an item to skip the radius sweep.
HoldToSweepCheckbox = Hold to Sweep Mode
HoldToSweepHelp = When enabled, items are only auto-picked up when the skip sweep hotkey is held during activation. Normal pickup does nothing.
