ccEDHSSE003_RedguardEliteSupplyChestKey|Received from Fijeh in Purewater Run during "Interception." Opens the Remnant Supply Chest nearby.|1

# Rielle Key
ccBGSSSE067_RielleKey|Carried by Norion the Undying, an ancient Ayleid Lich guarding the Great Welkynd Stone in Rielle Crypt.|1

