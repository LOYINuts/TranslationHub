# CREATION CLUB

# Aesrael's Key
ccBGSSSE064_Key|Carried by Aesrael, a member of a bandit group called the Crimson Dirks. Opens a chest within his camp west of Sunderstone Gorge in Falkreath Hold.|1

# Arch Necromancer's Key
ccRMSSSE001_StrongboxKey|Carried by a reanimated Skeleton Mage during "Dreams of the Dead." Opens the safe next to the enchanting table within Gallow's Hall.|1

# Attius Farm Cellar Key
ccASVSSE001_TrapDoorKey|Opens a trapdoor into the Old Attius Farm Cellar during "Buyer Beware."|1

# Bloodchill Manor Key
ccEEJSSE005_HouseKey|Unobtainable. Opens all the doors within Bloodchill Manor.|1

# Champion's Rest Passage Key
ccBGSSSE016_PassageKey|Carried by Umbra within the Nordic ruin of Champion's Rest in The Rift. Open's Umbra's inner sactum and an escape route out of the dungeon.|1

# Enchanted Tower Key
ccEEJSSE002_MageTowerKey|Unobtainable. Opens Myrwatch in Hjaalmarch Hold.|1

# Imperial Armory Key
ccFFBSSE001_KeyImperial|Received from Legate Adventus Caesennius during "Battle of the Champions." Opens a chest within an equipment room within Castle Dour in Solitude.|1

# Ironback Hideout Cellar Key
ccBGSSSE043_TrapDoorKey|Looted from Kragash's burnt corpse south of the Thalmor Embassy. Opens a trapdoor to a cellar underneath the ruined house at Ironback Hideout.|1

