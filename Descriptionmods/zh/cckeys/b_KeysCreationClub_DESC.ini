# USSEP
USKPHeartwoodMillKey|可打开心木磨坊，位于裂谷领金光庄园以西的一座伐木场。

# ASLAL
ARTHLALFarmhouseKey|可打开浅滩休憩农场的农舍，位于白漫领洛利克镇以北的住宅。