# 模组构建配置文件
# 
# 每个模组需要 translations.json 文件
# 
# 类型说明：
# - line: 分隔文本文件，指定 source, output, sep, encoding
# - json: JSON 源和 JSON 产物
# - qt: Qt TS 源和目标，由共享 Qt 处理器生成
# 使用通配符的 line 配置会逐文件构建，并用文件作用域键查找译文。
# 目录名以 mods.toml 中的 dir 为准；重命名目录后同步更新此文件。

# ── LINE-BASED MODS ────────────────────────────────────────────────────────

[[line]]
dir = "menu_translation/achievementinjector"
source = "AchievementInjector_english.txt"
output = "AchievementInjector_chinese.txt"
sep = "\t"
encoding = "utf16-le-bom"
package = [
  "interface/translations/AchievementInjector_english.txt",
  "interface/translations/AchievementInjector_chinese.txt",
]

