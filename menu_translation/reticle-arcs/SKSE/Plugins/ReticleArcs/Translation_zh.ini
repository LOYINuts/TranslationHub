; Reticle Arcs settings page text. a translation replaces this file, any line left out stays English
; lists are one line, the items separated by | and in the same order, the same count
; save as UTF-8

[Preview]
Page = 设置
MakeRoom = 为预览腾出空间
MakeRoomTip = 将本窗口移开，为预览留出位置

[Profiles]
Profile = 预设
ProfileTip = 已保存的外观与布局，选中即可载入
NoProfile = 无
Edited = （已修改）
UpdateProfile = 更新预设
UpdateProfileTip = 把改动存回这个预设
BundledTip = 随模组附带，更新时会被覆盖，请用“另存为”
UndoChanges = 撤销更改
UndoChangesTip = 恢复到预设保存时的状态
SaveAs = 另存为
SaveProfile = 保存
Delete = 删除
DeleteProfile = 删除预设
Cancel = 取消
ProfileLoaded = 预设已载入
ProfileSaved = 预设已保存
ProfileDeleted = 预设已删除
ProfileUnreadable = 无法读取该预设

[Bars]
Bars = 状态条
BarNames = 左手法术|右手法术|龙吼|弓
FirstPerson = 第一人称
Placements = 右侧|左侧|两侧|上方|下方
ThirdPerson = 第三人称
ThirdPersonPlacements = 同第一人称|右侧|左侧|两侧|上方|下方
Crossbow = 弩装填
CrossbowPlacements = 同弓|右侧|左侧|两侧|上方|下方
CrossbowTip = 装填弩时弓条的位置，两种视角均适用
Colour = 颜色
ColourSources = 固定|法术学派|元素|元素，否则学派|附加模组，否则元素或学派|附加模组，否则固定
ColourSourceTip = 元素：火焰、冰霜、闪电、阳光、毒素与吸取法术各有颜色，其他伤害法术沿用其施法光芒的颜色
BowAddOn = 附加模组，否则元素
BowColourSourceTip = 元素：火焰、冰霜与闪电的箭矢和弩矢各有颜色
SchoolColours = 学派颜色
Schools = 变化系|召唤系|毁灭系|幻术系|恢复系|其他
OtherTip = 由模组添加的学派
ElementColours = 元素颜色
Elements = 火焰|冰霜|闪电|阳光|毒素|吸取

[AddOns]
; bars added by other mods. their own names can be translated here too, by the add-on's id: MyModBar = name, MyModBarTip = tooltip
AddOns = 附加模组状态条
RingSides = 上方|下方|左侧|右侧
AddOnStopped = 该附加模组出错后已停止，详见 ReticleArcs.log
AddOnRing = 附加状态条置于外环
AddOnRingTip = 放在内置状态条外侧，因此永不与之重叠。关闭则与内置条同处一圈
AddOnGap = 间距
AddOnGapTip = 内置状态条与外环之间的间隔

[Look]
Look = 外观
Separate = 每条单设外观
SeparateTip = 关闭时会把弓的外观复制到其他状态条
Flash = 蓄满时
FlashTip = 蓄力满后播放一次短促特效
Flashes = 无|轻微闪烁|强烈闪烁|发光|闪光|脉动|耀光
Release = 释放时
ReleaseTip = 蓄力消耗后状态条的收场方式
Releases = 淡出|瞬间收拢|膨胀|扫出|闪烁|火花
Glow = 辉光
Glows = 无|柔和|强烈
GlowTip = 填充周围的柔光
FadeOut = 淡出
FadeOutTip = 蓄力结束后状态条淡出所需的时间
FadeOutUnused = 仅当状态条以“淡出”方式释放，或以“仅淡出”中断时生效

[Shape]
Shape = 形状
Form = 形态
Shapes = 弧形|直线
Radius = 半径
RadiusTip = 与准星的距离
HalfAngle = 长度
HalfAngleTip = 状态条从中点向两侧延伸的距离
Ends = 末端
EndShapes = 圆头|尖头|平头
PointLength = 尖端长度
Width = 宽度
Fill = 填充
GrowFrom = 填充起点
GrowFroms = 起点|终点|中点|两端
Shading = 明暗
ShadingTip = 渐变：沿中线较亮，纵向向条的中部逐渐变亮
Shadings = 平涂|渐变|纵向|玻璃|斜面
Track = 轨道
ShowTrack = 显示
Padding = 留白
PaddingTip = 填充周围露出轨道的宽度
Outline = 描边
OutlineTip = 轨道外侧的线条，0 为不显示
OutlineStyle = 样式
OutlineStyles = 单线|双线
OutlineAccent = 强调色
OutlineAccentTip = 描边上叠加的第二种颜色。斜面样式会从左上打光
OutlineAccents = 无|暗色内圈|内线|斜面
Ornaments = 装饰
OrnamentsTip = 两端外的小图形，使用描边颜色
OrnamentKinds = 无|菱形|箭头纹|细针|圆点
Shadow = 阴影
ShadowTip = 位于轨道之后，供明亮背景使用
Shadows = 无|柔和|强烈|偏移

[SizeAndPosition]
SizeAndPosition = 位置
Size = 大小
ScaleTip = 状态条与命中提示的大小
Opacity = 不透明度
OpacityTip = 状态条与命中提示的不透明度
FollowCrosshair = 跟随准星
FollowCrosshairTip = 准星被移动时跟随，例如 SmoothCam
FollowSmoothing = 跟随平滑
FollowSmoothingTip = 追上准星所需的时间，0 为立即
OffsetX = X 偏移
OffsetY = Y 偏移
OffsetTip = 把所有元素推离准星

[Feedback]
Feedback = 特效
Break = 中断时
BreakStyles = 仅淡出|碎裂|开裂坠落|飘散
BreakTip = 因硬直、受击或收起武器而丢失的蓄力，不含正常释放
Channel = 持续施法
ChannelTip = 需按住持续施放的法术，如火焰：状态条随魔法值一同下降
Channels = 不显示|简单|流动|脉动|微粒
StaffCharge = 法杖充能
StaffChargeTip = 法杖只剩一次施放时的外圈、耗尽时的警告，以及持续施法时的充能显示
MagickaWarning = 魔法值不足
WarningStyles = 无|轻微闪烁|闪烁并抖动
MagickaWarningTip = 魔法值不足的法术、空法杖或没有箭的弓，其状态条会以该颜色亮起
DualFlourish = 双手施法特效
DualFlourishTip = 双手施法就绪时播放。按元素区分：火焰、冰霜、闪电、阳光、毒素与吸取法术各有特效
DualEffects = 无|按元素|光环|涟漪|流星|过载|电弧|符文|漩涡
DualOther = 其他法术
DualOtherTip = 无元素法术的双手施法，如治疗
DualNeedsOpposite = 需左右法术条分处两侧
DualNotFirst = 未在第一人称：该视角下法术条不在两侧
DualNotThird = 未在第三人称：该视角下法术条不在两侧
DualNotEither = 法术条不在两侧，特效不会播放
ShoutTiers = 龙吼字符逐级变亮
ShoutTiersTip = 龙吼的每个字符都比前一个略亮

[Compatibility]
Compatibility = 兼容性
MoreTab = 更多
Performance = 性能
RecordPerformance = 记录性能数据
RecordPerformanceTip = 逐帧记录 Reticle Arcs 的耗时并与游戏帧对比。汇总与卡顿写入 ReticleArcs.log，逐帧数据写入 ReticleArcs-perf.csv
PerfMeasuring = 正在测量，10 秒后给出首批结果
PerfAverage = Reticle Arcs 单帧平均
PerfWorst = Reticle Arcs 单帧最差
PerfHitches = 游戏卡顿
PerfHitchShare = Reticle Arcs 在最严重卡顿中的占比
SmoothCam = 跟随 SmoothCam 准星
SmoothCamTip = 跟随它的 3D 准星。依赖 SmoothCam 内部实现，其更新可能导致失效
TDM = 跟随 TDM 锁定目标
TDMTip = True Directional Movement 的目标锁定，仅在非自由瞄准时生效
HudNG = 跟随 HUD NG 准星
HudNGTip = 读取 HUD NG 保存的布局。在其编辑器中所做的移动需保存后才生效
NotInstalled = 未安装

[HitIndicators]
HitsTab = 命中
YourHits = 你的命中
PlayerShow = 显示玩家命中
ShownFor = 显示范围
HitStyle = 样式
HitStyleTip = 命中时出现在准星周围的标记
HitStyles = 无|短线|弧线|箭头纹|圆环|菱形
HitColour = 命中
StrongColour = 潜行/重击
KillColour = 击杀
RangedHits = 远程
RangedHitsTip = 箭矢、弩矢与法术
MeleeHits = 近战
Kills = 击杀
KillsTip = 每次击杀都显示标记，即使关闭了远程或近战
BlockedHits = 被格挡
BlockedHitsTip = 目标格挡时显示暗色分裂标记，即使关闭了远程或近战
BashHits = 盾击
BashHitsTip = 盾牌与武器挥击命中时显示敲击标记，即使关闭了近战
SneakAttack = 潜行攻击
SneakAttackTip = 潜行攻击（远程或近战）时的特效，即使该类未启用标记。法术需配合 Magic Sneak Attacks
PowerAttack = 重击
PowerAttackTip = 重击时的特效，即使该类未启用标记
Flourishes = 无|闪光|冲击波|爆裂
TakenHits = 受到的命中
TakenHitsTip = 状态条外侧的标记，指示你被击中的方向
TakenShow = 显示受到的命中
TakenMelee = 近战
TakenRanged = 箭矢
TakenSpell = 法术
TakenSpellTip = 使用该法术元素的颜色
TakenPower = 重击
TakenBlocked = 被你格挡
TakenBlockedTip = 被你的盾牌或武器挡下的攻击，显示得更淡
TakenColour = 颜色
TakenColourTip = 近战、箭矢与无元素法术
TakenStyles = 无|弧线|宽弧|辉光弧|楔形|箭头纹|细针|涟漪
TakenDistance = 距离
TakenDistanceTip = 标记位于状态条外侧的距离
TakenLength = 长度
TakenThickness = 粗细
TakenSeconds = 持续时间
TakenAppear = 出现方式
TakenAppears = 淡入|弹出|滑入|闪烁并发光
TakenDisappear = 消失方式
TakenDisappears = 淡出|缩小|飘出|散开
TakenFollow = 跟随攻击者
TakenFollowTip = 标记随视角转动，始终指向击中你的人

[Accessibility]
Accessibility = 无障碍
ShapeCues = 低时变窄
ShapeCuesTip = 状态条见底时（如持续施法时的魔法值）除了变色，还会变窄
ReduceMotion = 减弱动态效果
ReduceMotionTip = 带位移的特效改为简单淡变或保持静止
HighContrast = 高对比度
HighContrastTip = 应用于所有外观：暗色内圈上加粗描边、强烈阴影与纯色

[Save]
Undo = 撤销更改
UndoTip = 恢复到打开本页时的设置。改动会即时保存
Undone = 已撤销更改
Saved = 已保存
SaveFailed = 保存失败
